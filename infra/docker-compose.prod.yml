# Production compose: API + Web panel.
# DB lives on Supabase, uploads live on Cloudflare R2 — both are reached
# via env vars sourced from a sibling .env file.
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: ecoback_api_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      USE_CLOUDFLARE_R2: '1'
    ports:
      - '3333:3333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3333/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: ecoback_web_prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5180:80'   # Painel web -> http://localhost:5180
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
